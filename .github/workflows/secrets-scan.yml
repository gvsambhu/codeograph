name: Secret scan

# Runs gitleaks on every push, to any branch, and on every PR to catch
# accidentally committed secrets. The repository is public, so a branch is
# exposed as soon as it is pushed — every branch is scanned, not only the ones
# that will be merged. Merges are blocked if any leak is detected (ADR-023, FR-21).
#
# To suppress a known-safe finding, add an allowlist entry to .gitleaksignore
# rather than disabling this workflow.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so gitleaks can scan every commit,
          # not just the files changed in this push.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
